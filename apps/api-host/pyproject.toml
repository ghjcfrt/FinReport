[project]
name = "finreport-api-host"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "finance-domain",
    "finance-application",
    "finance-adapters",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finreport_api"]
