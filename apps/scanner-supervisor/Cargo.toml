[package]
name = "finreport-scanner-supervisor"
version = "0.1.0"
edition = "2021"

[dependencies]
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["serde", "v4"] }

[[bin]]
name = "finreport-scanner-supervisor"
path = "src/main.rs"
