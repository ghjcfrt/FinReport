[project]
name = "finreport"
version = "0.1.0"
description = "Traceable financial-report extraction and analysis backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "psycopg[binary]>=3.2.3",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
    "pymupdf>=1.25.0",
    "finreport-api-host",
    "finance-testkit",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.optional-dependencies]
parser = [
    "camelot-py>=1.0.0",
    "pymupdf>=1.25.0",
]
worker = [
    "celery>=5.4.0",
    "redis>=5.2.0",
]

[tool.pytest.ini_options]
pythonpath = [
    "apps/api-host/src",
    "apps/worker-host/src",
    "packages/finance-domain/src",
    "packages/finance-application/src",
    "packages/finance-adapters/src",
    "packages/finance-testkit/src",
]
testpaths = ["tests"]

[tool.uv.workspace]
members = [
    "apps/api-host",
    "apps/worker-host",
    "packages/finance-domain",
    "packages/finance-application",
    "packages/finance-adapters",
    "packages/finance-testkit",
]

[tool.uv]
package = false

[tool.uv.sources]
finreport-api-host = { workspace = true }
finance-domain = { workspace = true }
finance-application = { workspace = true }
finance-adapters = { workspace = true }
finance-testkit = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]
