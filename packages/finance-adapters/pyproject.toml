[project]
name = "finance-adapters"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "finance-domain",
    "sqlalchemy>=2.0.36",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
    "pymupdf>=1.25.0",
    "camelot-py>=1.0.0",
    "boto3>=1.35.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_adapters"]
